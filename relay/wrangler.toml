# Relay for Arcana shared readings. Forwards encrypted frames between the two
# headsets in a room; never reads or stores them.
name = "arcana-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Web pages allowed to open rooms: the deployed site and its previews, plus
# the local dev server (on this computer, or on the Wi-Fi for a headset).
# In a pattern, * stands for letters, digits, and dashes.
ALLOWED_ORIGINS = "https://arcana-mr.vercel.app,https://arcana-mr-*.vercel.app,https://localhost:8081,http://localhost:8081,https://192.168.*.*:8081,https://10.*.*.*:8081"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# The free plan requires SQLite-backed Durable Objects (this one stores nothing).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
