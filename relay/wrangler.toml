# Relay for Arcana shared readings. Forwards encrypted frames between the two
# headsets in a room; never reads or stores them.
name = "arcana-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Pages allowed to connect, comma-separated. "*" matches one name label, for
# preview deployments. Set the production address here before deploying.
[vars]
ALLOWED_ORIGINS = "https://localhost:8081,http://localhost:8081"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# The free plan requires SQLite-backed Durable Objects (this one stores nothing).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
